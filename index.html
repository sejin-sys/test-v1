<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 본인인증</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- face-api AI 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <style>
    /* 가이드라인 영역 */
    .id-guide { width: 250px; height: 155px; border: 3px dashed #3b82f6; border-radius: 12px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
    .face-guide { width: 170px; height: 220px; border: 3px dashed #10b981; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
    
    /* 좌우 반전 클래스 (전면 카메라일 때만 사용) */
    .mirror {
      transform: scaleX(-1);
      -webkit-transform: scaleX(-1);
    }

    /* 📸 카메라 찰칵 효과 (Flash Motion) */
    @keyframes flashEffect {
      0% { opacity: 0; }
      10% { opacity: 0.8; }
      100% { opacity: 0; }
    }
    .camera-flash {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: white;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
    }
    .do-flash {
      animation: flashEffect 0.4s ease-out;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 text-center">
    <h1 class="text-2xl font-bold text-gray-900 mb-1">실시간 본인인증</h1>
    <!-- 응시자 성명 표시 -->
    <p id="user-display" class="text-base font-semibold text-blue-600 mb-2"></p>
    <p id="sub-title" class="text-xs text-gray-500 mb-4">시작 버튼을 눌러 카메라 권한을 허용해 주세요.</p>

    <!-- 상태 알림 박스 -->
    <div id="status-box" class="bg-blue-50 text-blue-700 p-3 rounded-lg text-sm mb-4 font-medium flex items-center justify-center gap-2 relative overflow-hidden">
      <span id="status-text">준비 완료</span>
      <div id="spinner" class="hidden animate-spin h-4 w-4 border-2 border-blue-600 border-t-transparent rounded-full"></div>
    </div>

    <!-- 카메라 및 가이드라인 영역 -->
    <div id="camera-container" class="relative w-full h-72 bg-black rounded-xl overflow-hidden mb-4 flex items-center justify-center">
      <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover hidden"></video>
      
      <!-- 📸 찰칵 효과용 오버레이 -->
      <div id="flash-overlay" class="camera-flash"></div>

      <div id="id-guide" class="id-guide hidden"></div>
      <div id="face-guide" class="face-guide hidden"></div>
      
      <!-- 카메라 전환 버튼 (카메라 실행 시 노출) -->
      <button id="switch-btn" onclick="switchCamera()" class="hidden absolute top-3 right-3 bg-black/60 text-white text-xs px-3 py-1.5 rounded-full z-10 flex items-center gap-1 hover:bg-black/80">
        🔄 카메라 전환
      </button>

      <button id="start-btn" onclick="initSystem()" class="px-5 py-3 bg-blue-600 text-white font-bold rounded-xl shadow hover:bg-blue-700 transition">
        🎥 카메라 켜기 및 인증 시작
      </button>
    </div>

    <canvas id="canvas" class="hidden"></canvas>

    <!-- 캡처/진행 버튼 -->
    <button id="action-btn" onclick="captureIDCard()" disabled class="w-full py-3.5 bg-gray-300 text-white font-bold rounded-xl shadow transition">
      📸 1단계: 신분증 촬영
    </button>
  </div>

  <script>
    // ----------------------------------------------------
    // 1. 설정 항목
    // ----------------------------------------------------
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycby9iaqzIcx_AMu7vz8uF0VAnWghElMrkgJbnfNnq5w/exec"; 
    
    // 🔗 인증 완료 후 이동할 링크
    const TARGET_TEST_URL = "https://testlink.org/"; 
    
    const MODEL_URL = 'https://raw.githubusercontent.com/vladmandic/face-api/master/model/';

    // 통과 기준치 (0.8로 설정)
    const THRESHOLD = 0.8; 

    // ----------------------------------------------------
    // 2. 변수 및 요소 선언
    // ----------------------------------------------------
    let userName = "";
    let idDescriptor = null;
    let idCardImg = '';
    let faceImg = '';
    let currentStream = null;
    let currentFacingMode = "environment";

    const webcam = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const statusText = document.getElementById('status-text');
    const spinner = document.getElementById('spinner');
    const startBtn = document.getElementById('start-btn');
    const actionBtn = document.getElementById('action-btn');
    const switchBtn = document.getElementById('switch-btn');
    const flashOverlay = document.getElementById('flash-overlay');

    // 페이지 접속 시 응시자 이름 받아오기
    window.onload = function() {
      while (!userName || userName.trim() === "") {
        userName = prompt("응시자 성명을 입력해 주세요:");
        if (userName === null) {
          alert("성명을 입력하셔야 인증을 진행할 수 있습니다.");
        }
      }
      userName = userName.trim();
      document.getElementById('user-display').innerText = `[ 응시자: ${userName} ]`;
    };

    // 📸 시각적 찰칵 모션 실행 함수
    function playFlash() {
      flashOverlay.classList.add('do-flash');
      setTimeout(() => {
        flashOverlay.classList.remove('do-flash');
      }, 400);
    }

    // 카메라 시작
    async function startWebcam(facingMode) {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      try {
        currentStream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: facingMode, width: 1280, height: 720 } 
        });
      } catch (err) {
        currentStream = await navigator.mediaDevices.getUserMedia({ video: true });
      }

      webcam.srcObject = currentStream;
      webcam.classList.remove('hidden');

      if (facingMode === "user") {
        webcam.classList.add('mirror');
      } else {
        webcam.classList.remove('mirror');
      }
    }

    // 카메라 초기화 및 AI 모델 로드
    async function initSystem() {
      startBtn.classList.add('hidden');
      spinner.classList.remove('hidden');
      statusText.innerText = "카메라 연결 및 시스템 준비 중...";

      try {
        await startWebcam(currentFacingMode);

        await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
        await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
        await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

        spinner.classList.add('hidden');
        statusText.innerText = "신분증 뒷자리를 가린 후 파란 테두리에 맞춰주세요.";
        document.getElementById('id-guide').classList.remove('hidden');
        switchBtn.classList.remove('hidden');
        
        actionBtn.innerText = "📸 1단계: 신분증 촬영 (뒷자리 마스킹 필수)";
        actionBtn.disabled = false;
        actionBtn.className = "w-full py-3.5 bg-blue-600 text-white font-bold rounded-xl shadow hover:bg-blue-700 transition";
      } catch (err) {
        spinner.classList.add('hidden');
        statusText.innerText = "카메라 권한 거부 또는 연결 실패";
        startBtn.classList.remove('hidden');
      }
    }

    // 카메라 수동 전환
    async function switchCamera() {
      currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
      await startWebcam(currentFacingMode);
    }

    // 캡처 함수 (네트워크 에러 방지를 위해 압축률 0.5로 변경하여 데이터 용량 절감)
    function getFrame() {
      canvas.width = webcam.videoWidth;
      canvas.height = webcam.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(webcam, 0, 0);
      return canvas.toDataURL('image/jpeg', 0.5);
    }

    // 1단계: 신분증 촬영 및 분석
    async function captureIDCard() {
      actionBtn.disabled = true;
      
      playFlash();

      spinner.classList.remove('hidden');
      statusText.innerText = "신분증 사진을 추출하고 분석하는 중입니다. 잠시만 기다려주세요...";

      await new Promise(r => setTimeout(r, 100));

      const detection = await faceapi.detectSingleFace(webcam).withFaceLandmarks().withFaceDescriptor();
      spinner.classList.add('hidden');

      if (detection) {
        idDescriptor = detection.descriptor;
        idCardImg = getFrame();

        statusText.innerText = "신분증 사진 추출 성공! 이제 화면의 녹색 원에 얼굴을 맞춰주세요.";
        document.getElementById('id-guide').classList.add('hidden');
        document.getElementById('face-guide').classList.remove('hidden');

        if (currentFacingMode !== "user") {
          currentFacingMode = "user";
          await startWebcam(currentFacingMode);
        }

        actionBtn.innerText = "👤 2단계: 실물 얼굴 대조 및 저장";
        actionBtn.className = "w-full py-3.5 bg-green-600 text-white font-bold rounded-xl shadow hover:bg-green-700 transition";
        actionBtn.onclick = verifyFace;
        actionBtn.disabled = false;
      } else {
        alert("신분증에서 얼굴을 인식하지 못했습니다.\n조명이 밝은 곳에서 가이드라인에 맞춰 다시 시도해 주세요.");
        statusText.innerText = "신분증 인식 실패. 다시 촬영해 주세요.";
        actionBtn.disabled = false;
      }
    }

    // 2단계: 실물 얼굴 대조 및 전송
    async function verifyFace() {
      actionBtn.disabled = true;

      playFlash();

      spinner.classList.remove('hidden');
      statusText.innerText = "실물 얼굴과 신분증 사진을 대조하는 중입니다. 움직이지 마세요...";

      await new Promise(r => setTimeout(r, 100));

      const detection = await faceapi.detectSingleFace(webcam).withFaceLandmarks().withFaceDescriptor();
      
      if (!detection) {
        alert("정면 얼굴이 감지되지 않았습니다.\n카메라를 정면으로 바라봐 주세요.");
        spinner.classList.add('hidden');
        actionBtn.disabled = false;
        return;
      }

      faceImg = getFrame();
      const distance = faceapi.euclideanDistance(idDescriptor, detection.descriptor);

      if (distance < THRESHOLD) {
        statusText.innerText = "얼굴 대조 완료! 데이터를 서버에 저장 중입니다...";
        
        // Google Apps Script 전송용 안정화 fetch 패턴
        fetch(GAS_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          redirect: 'follow',
          body: JSON.stringify({
            userId: userName,
            idCardImg: idCardImg,
            faceImg: faceImg,
            distance: distance.toFixed(4)
          })
        })
        .then(res => res.json())
        .then(data => {
          spinner.classList.add('hidden');
          if (data.success) {
            statusText.innerText = `✅ ${userName}님 본인 인증 성공! 검사 페이지로 이동합니다.`;
            setTimeout(() => {
              window.location.href = TARGET_TEST_URL;
            }, 1500);
          } else {
            alert("서버 처리 중 오류가 발생하였습니다. 다시 시도해 주세요.");
            statusText.innerText = "서버 전송 실패.";
            actionBtn.disabled = false;
          }
        })
        .catch(err => {
          console.error("전송 에러 상세:", err);
          spinner.classList.add('hidden');
          alert("네트워크 연결 오류가 발생했습니다. 구글 앱스 스크립트 배포 설정(모든 사용자 허용)을 재확인해 주세요.");
          statusText.innerText = "통신 에러가 발생했습니다.";
          actionBtn.disabled = false;
        });

      } else {
        spinner.classList.add('hidden');
        const diff = (distance - THRESHOLD).toFixed(4);
        const currentVal = distance.toFixed(4);
        
        alert(`신분증과 실물 얼굴이 일치하지 않습니다.\n(측정값: ${currentVal} / 기준치: ${THRESHOLD} / 초과: +${diff})\n\n정면을 바르게 보고 다시 시도해 주세요.`);
        statusText.innerText = `본인 인증 실패 (측정값: ${currentVal} / 기준: ${THRESHOLD})`;
        actionBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
